<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slither Clone</title>
<link rel="stylesheet" href="css.css">
</head>
<body>

  <!-- ===================== MAIN MENU ===================== -->
  <div id="menu">
    <div class="menu-box">
      <h1 class="title">SLITHER<span>.CLONE</span></h1>
      <p class="subtitle">Eat, grow, survive.</p>

      <input id="nameInput" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off">

      <div class="mode-select">
        <button id="modePvA" class="mode-btn active" data-mode="pva">Player vs AI</button>
        <button id="modeOnline" class="mode-btn disabled" data-mode="online" disabled>
          Slither Online <span class="soon">Coming Soon</span>
        </button>
      </div>

      <div id="difficultyWrap" class="difficulty-select">
        <p class="diff-label">Difficulty</p>
        <div class="diff-btns">
          <button class="diff-btn" data-difficulty="easy">Easy</button>
          <button class="diff-btn active" data-difficulty="medium">Medium</button>
          <button class="diff-btn" data-difficulty="hard">Hard</button>
        </div>
      </div>

      <button id="playBtn" class="play-btn">PLAY</button>

      <div class="menu-leaderboard">
        <h3>🏆 Top Scores</h3>
        <ol id="menuLeaderboardList"><li class="lb-empty">Loading...</li></ol>
      </div>

      <p class="hint">Move the mouse to steer. Click / hold Space to boost.</p>
    </div>
  </div>

  <!-- ===================== GAME UI ===================== -->
  <div id="gameUI" class="hidden">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-panel stats-panel">
        <div class="stat"><span class="label">Score</span><span id="scoreVal">0</span></div>
        <div class="stat"><span class="label">Length</span><span id="lengthVal">0</span></div>
        <div class="stat"><span class="label">FPS</span><span id="fpsVal">0</span></div>
        <div class="stat"><span class="label">Mode</span><span id="diffVal">-</span></div>
      </div>

      <div class="hud-panel leaderboard-panel">
        <h3>Leaderboard</h3>
        <ol id="liveLeaderboardList"></ol>
      </div>
    </div>

    <div id="minimapWrap">
      <canvas id="minimap"></canvas>
    </div>
  </div>

  <!-- ===================== DEATH SCREEN ===================== -->
  <div id="deathScreen" class="hidden">
    <div class="death-box">
      <h2>You Died</h2>
      <p id="deathStats"></p>
      <button id="respawnBtn" class="play-btn">BACK TO MENU</button>
    </div>
  </div>

  <!-- Supabase official CDN client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js.js"></script>
</body>
</html>
