<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slither Clone</title>
<link rel="stylesheet" href="css.css">
</head>
<body>

  <div id="menu">
    <div class="menu-box">
      <h1 class="title">SLITHER<span>.CLONE</span></h1>
      <p class="subtitle">Eat, grow, survive.</p>

      <input id="nameInput" type="text" maxlength="16" placeholder="Nickname (optional)" autocomplete="off">

      <div class="mode-select">
        <button id="modePvA" class="mode-btn active" data-mode="pva">Player vs AI</button>
        <button id="modeTopLeaderboard" class="mode-btn" data-mode="top">Top 10 Leaderboard</button>
        <button id="modeOnline" class="mode-btn disabled" data-mode="online" disabled>
          Slither Online <span class="soon">Coming Soon</span>
        </button>
      </div>

      <div id="difficultyWrap" class="difficulty-select">
        <p class="diff-label">Difficulty</p>
        <div class="diff-btns">
          <button class="diff-btn" data-difficulty="easy">Easy</button>
          <button class="diff-btn active" data-difficulty="medium">Medium</button>
          <button class="diff-btn" data-difficulty="hard">Hard</button>
        </div>
      </div>

      <div id="qualityWrap" class="difficulty-select">
        <p class="diff-label">Graphics</p>
        <div class="diff-btns">
          <button class="quality-btn active" data-quality="high">High Quality</button>
          <button class="quality-btn" data-quality="low">Low Quality</button>
        </div>
      </div>

      <button id="playBtn" class="play-btn">PLAY</button>

      <div class="stats-row">
        <div class="stats-box">
          <h3>Last Game</h3>
          <div class="stats-line"><span>Length</span><strong id="lastLength">-</strong></div>
          <div class="stats-line"><span>Boops</span><strong id="lastBoops">-</strong></div>
          <div class="stats-line"><span>When</span><strong id="lastWhen">-</strong></div>
        </div>
        <div class="stats-box">
          <h3>Best Game</h3>
          <div class="stats-line"><span>Length</span><strong id="bestLength">-</strong></div>
          <div class="stats-line"><span>Boops</span><strong id="bestBoops">-</strong></div>
          <div class="stats-line"><span>When</span><strong id="bestWhen">-</strong></div>
        </div>
      </div>

      <p class="hint">Move the mouse to steer. Hold Space or click to boost.</p>
    </div>
  </div>

  <div id="gameUI" class="hidden">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-panel leaderboard-panel">
        <h3>Leaderboard</h3>
        <ol id="liveLeaderboardList"></ol>
      </div>
    </div>

    <div id="rankReadout">
      <div>Your length: <strong id="rankLengthVal">0</strong></div>
      <div>Your rank: <strong id="rankPositionVal">- of -</strong></div>
    </div>

    <div id="minimapWrap">
      <canvas id="minimap"></canvas>
      <div id="serverLabel">server 4369</div>
    </div>
  </div>

  <div id="topLeaderboardOverlay" class="hidden">
    <div class="top-lb-box">
      <h2>Top 10 - Best Length</h2>
      <ol id="topLeaderboardList"><li class="lb-empty">Loading...</li></ol>
      <button id="closeTopLeaderboard" class="play-btn">Close</button>
    </div>
  </div>

  <div id="deathScreen" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <script src="js.js" defer></script>
  <script src="ai-brain.js" defer></script>
</body>
</html>
